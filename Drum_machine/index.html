<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Drum Machine</title>
</head>

<body>
    <div id="drum-machine">
        <p id="display"></p>
        <div id="pad-bank">
            <button id="heater-1" class="drum-pad">Q
                <audio src="https://cdn.freecodecamp.org/curriculum/drum/Heater-1.mp3" id="Q" class="clip"></audio>
            </button>
            <button id="heater-2" class="drum-pad">W
                <audio src="https://cdn.freecodecamp.org/curriculum/drum/Heater-2.mp3" id="W" class="clip"></audio>
            </button>
            <button id="heater-3" class="drum-pad">E
                <audio src="https://cdn.freecodecamp.org/curriculum/drum/Heater-3.mp3" id="E" class="clip"></audio>
            </button>
            <button id="heater-4" class="drum-pad">A
                <audio src="https://cdn.freecodecamp.org/curriculum/drum/Heater-4_1.mp3" id="A" class="clip"></audio>
            </button>
            <button id="clap" class="drum-pad">S
                <audio src="https://cdn.freecodecamp.org/curriculum/drum/Heater-6.mp3" id="S" class="clip"></audio>
            </button>
            <button id="open-hh" class="drum-pad">D
                <audio src="https://cdn.freecodecamp.org/curriculum/drum/Dsc_Oh.mp3" id="D" class="clip"></audio>
            </button>
            <button id="kick-n-hat" class="drum-pad">Z
                <audio src="https://cdn.freecodecamp.org/curriculum/drum/Kick_n_Hat.mp3" id="Z" class="clip"></audio>
            </button>
            <button id="kick" class="drum-pad">X
                <audio src="https://cdn.freecodecamp.org/curriculum/drum/RP4_KICK_1.mp3" id="X" class="clip"></audio>
            </button>
            <button id="closed-hh" class="drum-pad">C
                <audio src="https://cdn.freecodecamp.org/curriculum/drum/Cev_H2.mp3" id="C" class="clip"></audio>
            </button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
